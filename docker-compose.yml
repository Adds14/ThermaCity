version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: thermacity_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thermacity}
      POSTGRES_USER: ${POSTGRES_USER:-thermacity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thermacity_dev_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thermacity} -d ${POSTGRES_DB:-thermacity}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
    driver: local
